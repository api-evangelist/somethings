name: Somethings
description: >-
  Somethings is a teen mental health support platform that connects adolescents
  with Certified Peer Specialist Mentors through a mobile app for iOS and
  Android. Rather than traditional therapy or AI chatbots, teens can call or
  chat anytime with trained mentors who have personal lived experience
  overcoming challenges like anxiety, depression, self-harm, eating disorders,
  and ADHD, backed by clinical supervision. The service is HIPAA-compliant and
  sold to health plans, insurers, employers, and directly to parents. Somethings
  is a venture-backed company in the API Evangelist network; it operates a
  consumer/clinical mobile product and does not currently publish a public
  developer API surface.
